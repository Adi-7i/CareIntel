[project]
name = "careintel"
version = "0.1.0"
description = "CareIntel — non-diagnostic healthcare information and reviewer-workflow system"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    # Configuration
    "pydantic-settings>=2.5.0",
    # Database (async)
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    # Logging
    "python-json-logger>=2.0.7",
    # Utilities
    "python-ulid>=3.0.0",
    "pyjwt>=2.14.0",
    "cryptography>=50.0.1",
    "passlib>=1.7.4",
    "bcrypt>=5.0.0",
    "email-validator>=2.1.0",
    # Evidence & Storage
    "azure-storage-blob>=12.20.0",
    "python-multipart>=0.0.9",
    "python-magic>=0.4.27",
    "pgvector>=0.3.0",
    "openai>=1.40.0",
    "tiktoken>=0.7.0",
    "celery[redis]>=5.4.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "asgi-lifespan>=2.1.0",

    # Code quality
    "ruff>=0.6.0",
    "mypy>=1.11.0",

    # No external type stubs required for python-json-logger (bundled py.typed)
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/careintel"]

# ──────────────────────────────────────────────
# Ruff — formatter + linter (replaces black, isort, flake8)
# ──────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "S",    # flake8-bandit (security)
    "ANN",  # flake8-annotations (type hints)
    "RUF",  # ruff-specific rules
]
ignore = [
    "ANN401",  # Dynamically typed expressions (Any)
    "S101",    # Use of `assert` — needed in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S"]
"migrations/**/*.py" = ["ANN", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["careintel"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ──────────────────────────────────────────────
# Mypy — static type checking
# ──────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false
packages = ["careintel"]
mypy_path = "src"
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pythonjsonlogger.*"]
ignore_missing_imports = true

# ──────────────────────────────────────────────
# Pytest
# ──────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = [
    "--strict-markers",
    "--tb=short",
    "-q",
]
markers = [
    "unit: fast unit tests with no external dependencies",
    "api: API-level tests using ASGI test client",
    "integration: tests that require a live database",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning:asyncio",
    "ignore::DeprecationWarning:passlib.*",
    "ignore::DeprecationWarning:crypt",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

# ──────────────────────────────────────────────
# Coverage
# ──────────────────────────────────────────────
[tool.coverage.run]
source = ["src/careintel"]
omit = ["*/migrations/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 70

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "time-machine>=3.5.1",
]
