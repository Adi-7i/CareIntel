# Alembic configuration for CareIntel
# Managed by the application; do not manually edit the sqlalchemy.url key.
# The URL is always read from the DATABASE_URL environment variable via env.py.

[alembic]
# Path to migration scripts
script_location = migrations

# File template for new revisions
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for file timestamps
timezone = UTC

# Truncate long revision messages in filenames
truncate_slug_length = 40

# Output encoding
output_encoding = utf-8

# sqlalchemy.url is intentionally left empty here.
# env.py reads DATABASE_URL from the environment (or .env) via Settings.
# Never put credentials in this file.
sqlalchemy.url =

[post_write_hooks]
# Automatically format new migration files with ruff
hooks = ruff_format
ruff_format.type = exec
ruff_format.executable = %(here)s/.venv/bin/ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
